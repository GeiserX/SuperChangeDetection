name: Docker
# A release is a merge to main that changes __version__: it builds
# drumsergio/superchangedetection:<version> and then tags the commit v<version>. When that tag
# already exists the run does nothing, so every other push to main is a no-op. A tag pushed by
# hand still publishes its version, as before.
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: docker-publish
  cancel-in-progress: false
  queue: max # keep every pending run, so no version bump is dropped
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only the last step uses it, to create the tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Read the package version
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' superchangedetection/__init__.py)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad __version__: '$VERSION'"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $VERSION"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
      - id: tag
        name: Check whether v<version> is already released
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "tag v$VERSION pushed; publishing"; exit 0
          fi
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null
          code=$?
          set -e
          case $code in
            0) echo "publish=false" >> "$GITHUB_OUTPUT"; echo "v$VERSION is already released; nothing to do" ;;
            2) echo "publish=true" >> "$GITHUB_OUTPUT"; echo "v$VERSION is new; publishing" ;;
            *) echo "::error::git ls-remote failed with $code"; exit "$code" ;;
          esac
      - if: steps.tag.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v4
      - if: steps.tag.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.tag.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: steps.tag.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: drumsergio/superchangedetection:${{ steps.version.outputs.VERSION }}
      - if: steps.tag.outputs.publish == 'true' && github.ref_type == 'branch'
        name: Tag the released commit
        # A tag created with the workflow's own token starts no other workflow.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$VERSION" -f "sha=$GITHUB_SHA"
