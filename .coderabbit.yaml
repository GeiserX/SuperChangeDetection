language: "en-US"
tone_instructions: "Be direct and concise. No fluff."

reviews:
  profile: "chill"
  high_level_summary: true
  collapse_walkthrough: true
  poem: false
  sequence_diagrams: false
  suggested_reviewers: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!uv.lock"
    - "!docs/images/**"
  path_instructions:
    - path: "superchangedetection/**"
      instructions: |
        Flag any new hard-coded user-facing string (strings belong in superchangedetection/locales),
        any field reaching changedetection that is not in actions.ALLOWED, and anything that could
        print or log a token or an API key.
    - path: "superchangedetection/locales/**"
      instructions: Every key in en.yaml must exist in every other locale file. Spanish keeps its accents.
