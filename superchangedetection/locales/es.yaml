# Cadenas en español (claves de en.yaml).
app_name: SuperChangeDetection
language_name: Spanish (Spain)

notification_title: "🔔 {{watch_title}}"
notification_body: |
  🔔 Ha cambiado «{{watch_title}}»
  {{watch_url}}

  Ver el cambio: {{diff_url}}

  Si esto no es un cambio de verdad, o cambia algo y no te aviso, responde a este mensaje y lo ajusto.
  ref {{watch_uuid}}

result_create_ok: "✅ Vigilo «{title}»\n{url}\n\nLo que ve ahora:\n«{seen}»"
result_create_error: "⚠️ He creado «{title}» pero la primera comprobación ha fallado: {seen}\n{url}"
result_update_ok: "✅ Ajustado «{title}»\n\nLo que ve ahora:\n«{seen}»"
result_update_error: "⚠️ He ajustado «{title}» pero la comprobación ha fallado: {seen}"
result_delete_ok: "🗑️ Borrado «{title}»\n{url}"
result_recheck_ok: "🔄 Comprobado «{title}» ahora mismo\n\nLo que ve ahora:\n«{seen}»"
result_recheck_error: "⚠️ La comprobación de «{title}» ha fallado: {seen}"
result_failed: "⚠️ No he podido {op}: {error}"
result_seen_empty: "(nada: el filtro no ha encontrado texto)"
result_seen_pending: "(la primera comprobación aún no ha terminado; te avisaré cuando cambie, y puedes preguntarme qué ve)"
result_footer: "Te escribo aquí cuando cambie. Si ves que cambia y no te aviso, o te aviso sin motivo, dímelo (respóndeme o mencióname) y lo arreglo."

# ---- the chat
commands:
  lista: "Los avisos de este chat"
  nuevo: "Empezar una conversación nueva"
  ayuda: "Qué sé hacer"
  presentacion: "Quién soy y cómo hablarme"
  recordatorios: "Los recordatorios pendientes, para cancelarlos"
description: "Dime qué página quieres vigilar y te aviso cuando cambie. En un grupo, mencióname o responde a uno de mis mensajes."
short_description: "Avisos cuando cambia una web"
help: |
  Dime qué quieres vigilar, con el enlace, y lo monto: por ejemplo «avísame cuando cambie el precio de https://tienda.example/teclado» o «vigila si sale una versión nueva en https://example.com/releases, mira una vez al día».

  Cuando la página cambie te escribo aquí con el enlace al cambio. Si te aviso sin motivo, o cambia algo y me callo, responde a ese mensaje (o mencióname con @{handle}) y lo ajusto.
  {voice}{changes}
  /lista: los avisos de este chat
  /nuevo: empezar una conversación nueva
  /recordatorios: los recordatorios pendientes, para cancelarlos
  /presentacion: quién soy y cómo hablarme
  /ayuda: esto
help_voice: "Las notas de voz también valen: las escucho siempre, también en el grupo.\n"
help_changes: "Si quieres que funcione de otra forma (un comando nuevo, otra manera de avisar), pídemelo aquí y lo cambio yo.\n"
intro: |
  ¡Hola! Soy @{handle}, el vigilante de páginas web de este chat.

  Cómo funciono:
  • Dime qué quieres vigilar, con el enlace, y lo monto yo: «@{handle} vigila https://… y avísame si cambia el precio». Elijo la parte de la página que importa y cada cuánto mirar, y luego te enseño lo que ve.
  • Cuando cambie, te escribo aquí con el enlace al cambio. Para eso no hace falta hablarme.
  • Si te aviso sin motivo, o cambia algo y me callo, responde a ese aviso y lo ajusto.
  • En el grupo solo contesto si me mencionas o respondes a un mensaje mío. Leo el resto del chat para tener contexto, pero un comentario entre vosotros sobre mí no es una orden.
  • Cuando hay que elegir, pongo botones debajo de mi respuesta; puedes pulsar uno o seguir hablando. Cuando puedo hacer algo útil, te lo ofrezco con botones, y si no respondes, no hago nada.
  • Si hay algo que conviene recordar a una hora («recuérdame mirar esta página el viernes»), te ofrezco un recordatorio aquí con un botón. /recordatorios los enseña y deja cancelarlos.
  {voice}{changes}{mentions}
  /lista: los avisos de este chat · /recordatorios: los recordatorios · /nuevo: empezar de cero · /ayuda: esto mismo, resumido
