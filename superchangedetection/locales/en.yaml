# English strings. Every other locale carries the same keys; a missing key falls back to this file.
app_name: SuperChangeDetection
language_name: English

# What changedetection.io sends to the chat when a watch changes. Jinja tokens from changedetection:
# watch_title, watch_url, diff, diff_url, watch_uuid, triggered_text, current_snapshot.
notification_title: "🔔 {{watch_title}}"
notification_body: |
  🔔 Something changed on «{{watch_title}}»
  {{watch_url}}

  {{diff}}

  See the change: {{diff_url}}

  If this is not a real change, or something changed and I did not tell you, reply to this message and I will adjust the watch.
  ref {{watch_uuid}}

# What the app says after an action, in the chat
result_create_ok: "✅ Watching «{title}»\n{url}\n\nWhat it sees now:\n«{seen}»"
result_create_error: "⚠️ Created «{title}» but the first check failed: {seen}\n{url}"
result_update_ok: "✅ Adjusted «{title}»\n\nWhat it sees now:\n«{seen}»"
result_update_error: "⚠️ Adjusted «{title}» but the check failed: {seen}"
result_delete_ok: "🗑️ Deleted «{title}»\n{url}"
result_recheck_ok: "🔄 Checked «{title}» now\n\nWhat it sees now:\n«{seen}»"
result_recheck_error: "⚠️ Check of «{title}» failed: {seen}"
result_failed: "⚠️ Could not {op}: {error}"
result_seen_empty: "(nothing: the filter matched no text)"
result_seen_pending: "(the first check has not finished yet; I will tell you when it changes, and you can ask me what it sees)"
result_footer: "I will write here when it changes. If you see it change and I stay silent, or I warn you for nothing, tell me (reply to me or mention me) and I will fix it."

# ---- the chat
commands:
  lista: "The watches of this chat"
  nuevo: "Start a new conversation"
  ayuda: "What I can do"
description: "Tell me which page to watch and I will write here when it changes. In a group, mention me or reply to one of my messages."
short_description: "Alerts when a web page changes"
help: |
  Tell me what to watch, with the link, and I will set it up: for example "tell me when the price changes at https://shop.example/keyboard" or "watch for a new version at https://example.com/releases, once a day".

  When the page changes I write here, with the change. If I warn you for nothing, or something changes and I stay silent, reply to that message (or mention me with @{handle}) and I will adjust it.

  /lista: the watches of this chat
  /nuevo: start a new conversation
  /ayuda: this
chatid: "This chat: {id}"
new_ok: "Starting over. The watches stay as they are."
list_header: "Watches of this chat ({n}):"
list_item: "{n}. «{title}»\n{url}\nLast change: {changed}{error}"
list_empty: "This chat has no watches yet. Tell me what to watch."
ai_down: "I cannot think right now: the assistant is not answering. Your message is not lost; I will pick it up with the next one you send."
instance_down: "I cannot reach changedetection right now. Try again in a while."
bad_actions: "I understood what you want but I got the change wrong and touched nothing. Tell me again, in other words if you can."
button_yes: "Yes"
button_no: "No"
offer_delete: "Delete {titles}? Only {who} can confirm."
offer_only_asker: "Only {who} can answer this."
offer_expired: "That question has expired; ask me again."
offer_no: "OK, nothing deleted."
followup_ok: "✅ The first check of «{title}» is done. What it sees now:\n«{seen}»"
followup_error: "⚠️ The first check of «{title}» failed: {seen}"
followup_late: "⏳ The first check of «{title}» has not finished after {minutes} minutes. I will tell you when it changes; if you like, ask me what it sees or ask me to change the fetch mode."
