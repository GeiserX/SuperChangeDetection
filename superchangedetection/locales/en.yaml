# English strings. Every other locale carries the same keys; a missing key falls back to this file.
app_name: SuperChangeDetection
language_name: English

# What changedetection.io sends to the chat when a watch changes. Jinja tokens from changedetection:
# watch_title, watch_url, diff, diff_url, watch_uuid, triggered_text, current_snapshot.
notification_title: "🔔 {{watch_title}}"
notification_body: |
  🔔 Something changed on «{{watch_title}}»
  {{watch_url}}

  See the change: {{diff_url}}

  If this is not a real change, or something changed and I did not tell you, reply to this message and I will adjust the watch.
  ref {{watch_uuid}}

# What the app says after an action, in the chat
result_create_ok: "✅ Watching «{title}»\n{url}\n\nWhat it sees now:\n«{seen}»"
result_create_error: "⚠️ Created «{title}» but the first check failed: {seen}\n{url}"
result_update_ok: "✅ Adjusted «{title}»\n\nWhat it sees now:\n«{seen}»"
result_update_error: "⚠️ Adjusted «{title}» but the check failed: {seen}"
result_delete_ok: "🗑️ Deleted «{title}»\n{url}"
result_recheck_ok: "🔄 Checked «{title}» now\n\nWhat it sees now:\n«{seen}»"
result_recheck_error: "⚠️ Check of «{title}» failed: {seen}"
result_failed: "⚠️ Could not {op}: {error}"
result_seen_empty: "(nothing: the filter matched no text)"
result_seen_pending: "(the first check has not finished yet; I will tell you when it changes, and you can ask me what it sees)"
result_footer: "I will write here when it changes. If you see it change and I stay silent, or I warn you for nothing, tell me (reply to me or mention me) and I will fix it."

# ---- the chat
commands:
  lista: "The watches of this chat"
  nuevo: "Start a new conversation"
  ayuda: "What I can do"
  presentacion: "Who I am and how to talk to me"
  recordatorios: "Reminders still to come, to cancel them"
description: "Tell me which page to watch and I will write here when it changes. In a group, mention me or reply to one of my messages."
short_description: "Alerts when a web page changes"
help: |
  Tell me what to watch, with the link, and I will set it up: for example "tell me when the price changes at https://shop.example/keyboard" or "watch for a new version at https://example.com/releases, once a day".

  When the page changes I write here, with a link to the change. If I warn you for nothing, or something changes and I stay silent, reply to that message (or mention me with @{handle}) and I will adjust it.
  {voice}{changes}
  /lista: the watches of this chat
  /nuevo: start a new conversation
  /recordatorios: the reminders still to come, to cancel them
  /presentacion: who I am and how to talk to me
  /ayuda: this
help_voice: "Voice notes work too: I always listen to them, in the group as well.\n"
help_changes: "If you want me to work differently (a new command, another way of telling you), ask me here and I will change it myself.\n"
intro: |
  Hi! I am @{handle}, the page watcher of this chat.

  How I work:
  • Tell me what to watch, with the link, and I set it up: "@{handle} watch https://… and tell me if the price changes". I pick the part of the page that matters and how often to look, then show you what it sees.
  • When it changes, I write here with a link to the change. You do not need to talk to me for that.
  • If I warn you for nothing, or something changes and I stay silent, reply to that alert and I will adjust it.
  • In a group I only answer when you mention me or reply to one of my messages. I read the rest of the chat for context, but a remark between you about me is not an order.
  • When there is a choice I put buttons under my answer; you can tap one or just keep talking. When I could do something useful I offer it with buttons, and if you do not answer I do nothing.
  • When something is worth remembering at a time ("remind me to look at this page on Friday"), I offer a reminder here with a button. /recordatorios lists them and lets you cancel them.
  {voice}{changes}{mentions}
  /lista: the watches of this chat · /recordatorios: reminders · /nuevo: start over · /ayuda: this, in short
intro_voice: "• Voice notes: I always listen to them, in the group as well, and write down what I heard.\n"
intro_changes: "• If you want me to work differently (a new command, another way of telling you), ask me here and I will change it myself; it goes live with my next release.\n"
intro_mentions: "• Right now the group's mentions do not reach me: make me an admin of the group, or reply to my messages.\n"
voice_failed: "I could not make out that voice note."
chatid: "This chat: {id}"
new_ok: "Starting over. The watches stay as they are."
list_header: "Watches of this chat ({n}):"
list_item: "{n}. «{title}»\n{url}\nLast change: {changed}{error}"
list_empty: "This chat has no watches yet. Tell me what to watch."
ai_down: "I cannot think right now: the assistant is not answering. Your message is not lost; I will pick it up with the next one you send."
instance_down: "I cannot reach changedetection right now. Try again in a while."
bad_actions: "I understood what you want but I got the change wrong and touched nothing. Tell me again, in other words if you can."
button_yes: "Yes"
button_no: "No"
offer_delete: "Shall I stop watching {titles}? Only {who} can confirm.\n\nIf you want something else, reply to this message."
offer_only_asker: "Only {who} can answer this."
offer_expired: "That question has expired; ask me again."
offer_no: "OK, nothing deleted."
offer_proposal: "{summary}\n\nShall I? Only {who} can confirm.\n\nIf you want something else, reply to this message."
offer_proposal_users: "{summary}\n\nShall I? Only the people who run me can confirm.\n\nIf you want something else, reply to this message."
offer_only_users: "Only the people who run me can answer this."
offer_proposal_no: "OK, I will not."
proposal_members_only: "Only the people who run me can ask for this."
proposal_failed: "It did not work out: {error}"
proposal_unsupported: "The AI provider cannot carry this out."
proposal_interrupted: "I restarted while working on this and it did not finish. Ask me again if you still want it."
followup_ok: "✅ The first check of «{title}» is done. What it sees now:\n«{seen}»"
followup_error: "⚠️ The first check of «{title}» failed: {seen}"
followup_late: "⏳ The first check of «{title}» has not finished after {minutes} minutes. I will tell you when it changes; if you like, ask me what it sees or ask me to change the fetch mode."

# ---- buttons under an answer, and reminders
# what to offer when someone sends a page without saying how often: every hour, every day, look
# once now (no watch), no (nothing)
paste_options: ["Every hour", "Every day", "Just once", "No"]
options_hint: "Or tell me something else."
confirm_hint: "If you want something else, reply to this message."
offer_hint: "If you do not answer, I do nothing."
button_timeout: "No answer: nothing"
tap_gone: "This is no longer waiting for an answer."
tapped: "«{label}» (tapped under your message: {question})"
remind_offer: "{name}, shall I remind you?\n{lines}\n\nIf you do not answer, I do nothing."
remind_here: "Reminder here"
remind_nothing: "No"
remind_set: "I will remind you here on {when}."
remind_watch: " (and I check «{title}» again)"
reminder_when: "{weekday} {day} {month}, {time}"
weekdays: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
months: [January, February, March, April, May, June, July, August, September, October, November, December]
reminder_late: "(late: it was for {when})"
reminders_none: "There are no reminders to come in this chat."
reminders_title: "⏰ Reminders to come:"
reminders_cancel: "Cancel {n}"
reminders_cancelled: "Cancelled {n}"
reminder_cancelled: "Cancelled."
